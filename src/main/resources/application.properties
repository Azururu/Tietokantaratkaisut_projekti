spring.application.name=webstore-api

# Credentials come from environment variables or a local .env file (not in git).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/webstore}
spring.datasource.username=${DB_USER:webstore_app}
spring.datasource.password=${DB_PASSWORD}

# Connection pool size for a small webstore (see assignment 3).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# The schema is owned by the SQL scripts. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Load data inside service transactions only, not lazily while writing the JSON response.
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=debug
